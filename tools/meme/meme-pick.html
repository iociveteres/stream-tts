<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мемные голоса</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e3e1dc;
  --accent: #2f6fdf; --accent-soft: #e6eefc; --warn: #a35f00; --warn-soft: #fdf1df;
  --ok: #2c7a3f; --ok-soft: #e4f3e7; --chip: #efede8; --ref: #7a3fb0; --ref-soft: #f1e8f8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #212226; --fg: #e9e9e9; --muted: #9a9a9a; --line: #34353a;
    --accent: #7aa7ff; --accent-soft: #24304a; --warn: #f0b35a; --warn-soft: #3a2f1e;
    --ok: #74c58a; --ok-soft: #1f3326; --chip: #2c2d31; --ref: #c9a0f0; --ref-soft: #33283d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, textarea { font: inherit; color: inherit; }
header {
  position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.progress { color: var(--muted); font-size: 13px; }
.busy { font-size: 13px; color: var(--warn); }
main { padding: 16px; max-width: 1060px; margin: 0 auto; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.card.decided { border-color: var(--ok); }
.head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.head b { font-size: 17px; }
.vid { color: var(--muted); font-size: 13px; }
.gnote { font-size: 13px; color: var(--muted); margin-top: 2px; }
.grid { display: grid; grid-template-columns: minmax(220px, 1.6fr) repeat(var(--cols), minmax(70px, 1fr)); gap: 6px 10px; align-items: center; margin-top: 10px; }
.colhead { font-size: 12px; color: var(--muted); line-height: 1.25; }
.alt { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 8px; }
.alt.picked { background: var(--accent-soft); }
.alt.ref { background: var(--ref-soft); }
.alt .id { font-weight: 600; }
.alt .meta { font-size: 12px; color: var(--muted); }
.badge { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.alt .txt { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.alt .txt:hover { -webkit-line-clamp: unset; }
.play { width: 100%; height: 34px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; cursor: pointer; }
.play:hover { border-color: var(--accent); }
.play.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.play.refp { border-color: var(--ref); color: var(--ref); }
.play.refp.on { background: var(--ref); color: #fff; }
.empty { text-align: center; color: var(--muted); font-size: 12px; }
.take { align-self: flex-start; margin-top: 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 1px 12px; cursor: pointer; font-size: 13px; }
.take.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.foot { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; flex-wrap: wrap; font-size: 13px; }
.foot textarea { flex: 1 1 320px; min-height: 34px; resize: vertical; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.saved { color: var(--ok); font-size: 12px; align-self: center; }
@media (max-width: 700px) {
  .grid { grid-template-columns: repeat(var(--cols), 1fr); }
  .alt { grid-column: 1 / -1; }
  .corner { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Мемные голоса</h1>
  <span class="progress" id="progress"></span>
  <span class="busy" id="busy"></span>
</header>
<main id="main"><p class="hint">Загрузка…</p></main>
<script>
let S = null;
const player = new Audio();
let playing = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const enc = encodeURIComponent;

function play(btn) {
  if (playing === btn) { player.pause(); return; }
  if (playing) playing.classList.remove("on");
  player.src = btn.dataset.src + "?t=" + Date.now();
  player.play();
  playing = btn;
  btn.classList.add("on");
}
player.addEventListener("pause", () => { if (playing) playing.classList.remove("on"); playing = null; });
player.addEventListener("ended", () => { if (playing) playing.classList.remove("on"); playing = null; });

function card(g) {
  const n = g.phrases.length;
  const cols = [`<div class="colhead corner"></div>`, `<div class="colhead">сам образец</div>`]
    .concat(g.phrases.map((p, i) => `<div class="colhead" title="${esc(p)}">${i + 1}. ${i === 0 && g.ref ? "<b>как у JeetBot:</b> " : ""}${esc(p.length > 34 ? p.slice(0, 32) + "…" : p)}</div>`));
  const rows = [];
  if (g.ref) {
    rows.push(`<div class="alt ref"><span class="id">Эталон JeetBot</span>
      <span class="meta">их синтез; оригинал персонажа звучит иначе</span></div>
      <div class="empty">—</div>
      <div><button class="play refp" data-src="/ref/${enc(g.voice)}" title="${esc(g.phrases[0])}">▶</button></div>`
      + "<div></div>".repeat(n - 1));
  }
  for (const a of g.alts) {
    const picked = g.pick.includes(a.id);
    const cells = [`<div><button class="play" data-src="/alt/${enc(g.voice)}/${enc(a.id)}.wav" title="образец, ${a.dur} с">▶</button></div>`];
    a.synth.forEach((ok, i) => cells.push(ok
      ? `<div><button class="play" data-src="/ab/${enc(g.voice + "." + a.id + "." + (i + 1))}.wav" title="${esc(g.phrases[i])}">▶</button></div>`
      : `<div class="empty">нет синтеза</div>`));
    rows.push(`<div class="alt ${picked ? "picked" : ""}">
        <span><span class="id">${esc(a.id)}</span> ${esc(a.label)} ${a.current ? '<span class="badge">стоит сейчас</span>' : ""}</span>
        <span class="meta">${a.dur} с${a.install !== g.voice ? " · ставится как " + esc(a.install) : ""}${a.post ? " · эффект: " + esc(a.post) : ""}</span>
        <span class="txt" title="${esc(a.text)}">${esc(a.text)}</span>
        <button class="take ${picked ? "on" : ""}" data-voice="${esc(g.voice)}" data-id="${esc(a.id)}">${picked ? "✓ Беру" : "Беру"}</button>
      </div>` + cells.join(""));
  }
  const missing = g.alts.some(a => a.synth.includes(false));
  return `<section class="card ${g.pick.length ? "decided" : ""}" id="g-${esc(g.voice)}">
    <div class="head"><b>${esc(g.title)}</b><span class="vid">${esc(g.voice)}</span></div>
    ${g.note ? `<div class="gnote">${esc(g.note)}</div>` : ""}
    <div class="grid" style="--cols:${n + 1}">${cols.join("")}${rows.join("")}</div>
    <div class="foot">
      <textarea data-voice="${esc(g.voice)}" placeholder="Что не так на слух (шум, не тот актёр, акцент, интонация…)">${esc(g.comment)}</textarea>
      ${missing ? `<button class="take synth" data-voice="${esc(g.voice)}">Озвучить недостающее</button>` : ""}
      <span class="saved" data-saved="${esc(g.voice)}"></span>
    </div>
  </section>`;
}

function render() {
  const done = S.groups.filter(g => g.pick.length || g.comment).length;
  document.getElementById("progress").textContent = `отмечено ${done} из ${S.groups.length}`;
  document.getElementById("busy").textContent = S.busy ? "⏳ " + S.busy : "";
  const focus = document.activeElement?.dataset?.voice;
  const drafts = {};
  document.querySelectorAll("textarea").forEach(t => { drafts[t.dataset.voice] = t.value; });
  document.getElementById("main").innerHTML = `
    <p class="hint">Строки — образцы голоса, столбцы — сам образец и синтез одних и тех же фраз (seed один).
    Первая фраза — та же, что в примере JeetBot. Можно взять несколько вариантов, если они ставятся под разными именами.
    Заметка сохраняется сама.</p>` + S.groups.map(card).join("");
  document.querySelectorAll("textarea").forEach(t => {
    if (t.dataset.voice in drafts && drafts[t.dataset.voice] !== t.value) t.value = drafts[t.dataset.voice];
    if (t.dataset.voice === focus) t.focus();
  });
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

async function load() {
  S = await (await fetch("/api/state")).json();
  render();
  if (S.busy) setTimeout(load, 3000);
}

document.addEventListener("click", async e => {
  const p = e.target.closest(".play");
  if (p) return play(p);
  const s = e.target.closest(".synth");
  if (s) {
    const j = await post("/api/synth", { voices: [s.dataset.voice] });
    if (!j.ok) alert(j.error);
    return setTimeout(load, 500);
  }
  const t = e.target.closest(".take");
  if (!t) return;
  const g = S.groups.find(g => g.voice === t.dataset.voice);
  const pick = g.pick.includes(t.dataset.id) ? g.pick.filter(x => x !== t.dataset.id) : g.pick.concat(t.dataset.id);
  const j = await post("/api/pick", { voice: g.voice, pick });
  if (j.ok) { g.pick = j.pick; render(); }
});

let timers = {};
document.addEventListener("input", e => {
  const t = e.target.closest("textarea");
  if (!t) return;
  clearTimeout(timers[t.dataset.voice]);
  timers[t.dataset.voice] = setTimeout(async () => {
    const j = await post("/api/pick", { voice: t.dataset.voice, note: t.value });
    if (j.ok) {
      S.groups.find(g => g.voice === t.dataset.voice).comment = j.note;
      const m = document.querySelector(`[data-saved="${CSS.escape(t.dataset.voice)}"]`);
      if (m) { m.textContent = "сохранено"; setTimeout(() => { m.textContent = ""; }, 1500); }
    }
  }, 600);
});

load();
</script>
</body>
</html>
