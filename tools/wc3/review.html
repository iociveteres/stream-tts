<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отслушивание образцов</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e3e1dc;
  --accent: #2f6fdf; --accent-soft: #e6eefc; --warn: #a35f00; --warn-soft: #fdf1df;
  --ok: #2c7a3f; --ok-soft: #e4f3e7; --bad: #b3261e; --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --panel: #212226; --fg: #e9e9e9; --muted: #9a9a9a; --line: #34353a;
    --accent: #7aa7ff; --accent-soft: #24304a; --warn: #f0b35a; --warn-soft: #3a2f1e;
    --ok: #74c58a; --ok-soft: #1f3326; --bad: #ff8a80; --chip: #2c2d31;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
header {
  position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.progress { color: var(--muted); font-size: 13px; }
.bar { width: 140px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.filters { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px;
  font-size: 13px; cursor: pointer;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 52px); }
nav { border-right: 1px solid var(--line); padding: 8px; position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; }
nav button {
  display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left;
  border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer;
}
nav button:hover { background: var(--chip); }
nav button.on { background: var(--accent-soft); color: var(--accent); }
nav small { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
nav button.done small { color: var(--ok); }
main { padding: 16px; max-width: 980px; }
.voice-title { margin: 0 0 4px; font-size: 20px; }
.voice-sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  margin-bottom: 12px; scroll-margin-top: 70px;
}
.card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.cid { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.cur { background: var(--accent-soft); color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; }
audio { width: 100%; height: 36px; margin: 2px 0 10px; }
.rate-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.scores { display: flex; gap: 4px; }
.scores button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  cursor: pointer; font-weight: 600;
}
.scores button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.scores button.on.s1, .scores button.on.s2 { background: var(--bad); border-color: var(--bad); }
.scores button.on.s5 { background: var(--ok); border-color: var(--ok); }
.field { flex: 1 1 180px; min-width: 150px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
.field:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.emos { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: -2px 0 10px; }
.emos .chip, .picker .chip { font-size: 12px; padding: 1px 8px; }
.chip.partial { border-style: dashed; border-color: var(--accent); color: var(--accent); }
.emo-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.custom-emo { flex: 0 0 90px; min-width: 0; padding: 1px 8px; font-size: 12px; border-radius: 999px; }
.summary { font-size: 12px; color: var(--muted); margin-left: 6px; }
.summary.mixed { color: var(--warn); }
.ptag { border: 0; border-radius: 999px; padding: 0 8px; background: var(--accent-soft); color: var(--accent); cursor: pointer; font-size: 12px; }
.ptag:hover { text-decoration: line-through; }
.sep { flex: 1; }
.reject.on { color: var(--bad); font-weight: 600; }
.picker { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 4px 0 2px 6px; padding: 6px; border-radius: 8px; background: var(--bg); }
.part.bad textarea { text-decoration: line-through; opacity: .5; }
.part.bad .play { opacity: .5; }
.parts { border-top: 1px dashed var(--line); padding-top: 8px; }
.part { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 4px 0; }
.part .play {
  width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  cursor: pointer; font-size: 11px; margin-top: 3px;
}
.part .play.playing { background: var(--accent); color: #fff; border-color: var(--accent); }
textarea {
  width: 100%; resize: none; overflow: hidden; border: 1px solid transparent; background: transparent;
  border-radius: 6px; padding: 3px 6px; line-height: 1.4;
}
textarea:hover { border-color: var(--line); }
.part.dirty textarea { border-color: var(--accent); background: var(--bg); }
.part-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-left: 6px; }
.src { padding: 0 6px; border-radius: 4px; background: var(--chip); }
.src.fix { background: var(--ok-soft); color: var(--ok); }
.link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--accent); font-size: 12px; }
.alt { color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 3px 8px; margin: 2px 0 0 6px; font-size: 13px; }
.save-btns { display: none; gap: 6px; }
.part.dirty .save-btns { display: inline-flex; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 10px; cursor: pointer; font-size: 12px; }
.btn.ghost { background: none; color: var(--accent); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.keys { color: var(--muted); font-size: 12px; margin-top: 24px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; background: var(--panel); }
#toast {
  position: fixed; bottom: 16px; right: 16px; background: var(--fg); color: var(--bg); padding: 6px 12px;
  border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: .92; }
#toast.err { background: var(--bad); color: #fff; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; height: auto; display: flex; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  nav button { width: auto; white-space: nowrap; }
  .filters { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Отслушивание · <span id="batch"></span></h1>
  <div class="bar"><i id="bar-fill"></i></div>
  <span class="progress" id="progress"></span>
  <div class="filters">
    <button class="chip on" data-filter="all">Все</button>
    <button class="chip" data-filter="unrated">Без оценки</button>
    <button class="chip" data-filter="check">⚠ Сверить текст</button>
    <button class="chip" id="auto" title="После оценки клавишей переходить к следующему клипу и запускать его">Автопереход</button>
  </div>
</header>
<div class="layout">
  <nav id="voices"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<audio id="part-player" hidden></audio>

<script>
const EMOTIONS = ["спокойно", "приказ", "гнев", "крик", "шутка", "устало", "драма", "угроза", "радость"];
const SRC = { sub: "субтитр", asr: "Whisper", draft: "черновик", fix: "проверено", ref: "текущий образец" };
const SCORE_HINT = { 1: "брак", 2: "плохо", 3: "годится", 4: "хорошо", 5: "беру как есть" };

let state = { clips: {}, ratings: {} };
let voice = null, filter = "all", active = null;
let auto = localStore("auto") === "1";

function localStore(k, v) {
  try {
    if (v === undefined) return localStorage.getItem("review." + k);
    localStorage.setItem("review." + k, v);
  } catch (e) { return null; }
}
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const short = cid => cid.split(".").pop();
const rating = cid => state.ratings[cid] || { score: "", emotion: "", comment: "" };
const needsCheck = c => c.parts.some(p => p.alt);
const fileName = rel => rel.split("/").pop();
const tagOf = rel => state.tags[rel] || {};
const emotionsOf = rel => tagOf(rel).emotions || [];
let playingRel = null, openPicker = null;  // какая реплика звучит; у какой фразы открыт выбор эмоций

function allEmotions() {
  const used = Object.values(state.tags).flatMap(t => t.emotions || []);
  return [...new Set([...EMOTIONS, ...used])];
}

// Эмоция у фраз клипа: "on" — у всех (кроме «не брать»), "partial" — у некоторых.
function clipEmotion(c, e) {
  const parts = c.parts.filter(p => !tagOf(p.rel).bad);
  const n = parts.filter(p => emotionsOf(p.rel).includes(e)).length;
  return n && n === parts.length ? "on" : n ? "partial" : "";
}

function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.className = "", 1400);
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (!r.ok || data.ok === false) throw new Error(data.error || r.statusText);
  return data;
}

function voices() {
  const out = {};
  for (const [cid, c] of Object.entries(state.clips)) {
    const v = out[c.voice] ||= { id: c.voice, title: c.title, total: 0, rated: 0, check: 0 };
    v.total++; if (rating(cid).score) v.rated++; if (needsCheck(c)) v.check++;
  }
  return Object.values(out);
}

function visible() {
  return Object.entries(state.clips).filter(([cid, c]) =>
    c.voice === voice &&
    (filter !== "unrated" || !rating(cid).score) &&
    (filter !== "check" || needsCheck(c)));
}

function renderNav() {
  const vs = voices();
  const total = vs.reduce((a, v) => a + v.total, 0), rated = vs.reduce((a, v) => a + v.rated, 0);
  $("#progress").textContent = `оценено ${rated} из ${total}`;
  $("#bar-fill").style.width = (total ? rated / total * 100 : 0) + "%";
  $("#voices").innerHTML = vs.map(v => `
    <button class="${v.id === voice ? "on" : ""} ${v.rated === v.total ? "done" : ""}" data-voice="${v.id}">
      <span>${esc(v.title)}</span><small>${v.check ? "⚠" + v.check + " · " : ""}${v.rated}/${v.total}</small>
    </button>`).join("");
}

function renderPart(cid, p, i) {
  const alt = p.alt ? p.alt.replace(/^[^:]+:\s*/, "") : null;
  const bad = tagOf(p.rel).bad, mine = emotionsOf(p.rel), playing = playingRel === p.rel;
  const picker = openPicker === `${cid}|${i}`;
  return `
    <div class="part ${bad ? "bad" : ""}" data-cid="${cid}" data-i="${i}">
      <button class="play ${playing ? "playing" : ""}" title="Прослушать только эту реплику">${playing ? "■" : "▶"}</button>
      <div>
        <textarea rows="1" spellcheck="true">${esc(p.text)}</textarea>
        <div class="part-foot">
          ${mine.map(e => `<button class="ptag" data-untag="${esc(e)}" title="Убрать метку">${esc(e)} ×</button>`).join("")}
          <button class="link pick" title="Эмоция этой фразы">${mine.length ? "＋" : "＋ эмоция"}</button>
          <button class="link reject ${bad ? "on" : ""}" title="Не использовать фразу в нарезках">${bad ? "✗ не брать" : "не брать"}</button>
          <span class="sep"></span>
          <span class="src ${p.src}">${SRC[p.src] || p.src}</span>
          <span>${esc(fileName(p.rel))}</span>
          ${p.src !== "fix" ? `<button class="link confirm" title="Текст совпадает со звуком">✓ верно</button>` : ""}
          <span class="save-btns"><button class="btn save">Сохранить</button><button class="btn ghost cancel">Отмена</button></span>
        </div>
        ${picker ? `<div class="picker">${allEmotions().map(e =>
          `<button class="chip ${mine.includes(e) ? "on" : ""}" data-part-emo="${esc(e)}">${esc(e)}</button>`).join("")}
          <input class="field custom-emo" data-scope="part" placeholder="своя…"></div>` : ""}
        ${alt ? `<div class="alt">⚠ ${esc(p.alt)} <button class="link take">взять этот вариант</button></div>` : ""}
      </div>
    </div>`;
}

function renderEmos(cid, c) {
  const summary = rating(cid).emotion;
  return `<span class="emo-label" title="Метка ставится или снимается у всех фраз клипа сразу">все фразы:</span>
    ${allEmotions().map(e => `<button class="chip ${clipEmotion(c, e)}" data-clip-emo="${esc(e)}">${esc(e)}</button>`).join("")}
    <input class="field custom-emo" data-scope="clip" placeholder="своя…">
    ${summary ? `<span class="summary ${summary.includes("смешанная") ? "mixed" : ""}">${esc(summary)}</span>` : ""}`;
}

function renderHead(cid, c) {
  const tag = c.tag === "current" ? `<span class="tag cur">текущий образец</span>` : `<span class="tag">${esc(c.tag)}</span>`;
  return `
        <span class="cid">${short(cid)}</span>${tag}
        ${needsCheck(c) ? `<span class="tag warn">⚠ сверить текст</span>` : ""}
        <span class="meta">${c.dur.toFixed(1)} с · реплик: ${c.parts.length}</span>`;
}

function renderCard(cid, c) {
  const r = rating(cid);
  return `
    <section class="card ${cid === active ? "active" : ""}" id="${cid}" data-cid="${cid}">
      <div class="card-head">${renderHead(cid, c)}</div>
      <audio controls preload="none" src="/clip/${encodeURIComponent(c.voice)}/${encodeURIComponent(cid)}.wav"></audio>
      <div class="rate-row">
        <div class="scores">${[1, 2, 3, 4, 5].map(n =>
          `<button class="s${n} ${String(r.score) === String(n) ? "on" : ""}" data-score="${n}" title="${n} — ${SCORE_HINT[n]}">${n}</button>`).join("")}</div>
        <input class="field comment" placeholder="комментарий к клипу: стыки, паузы, общее впечатление…" value="${esc(r.comment)}">
      </div>
      <div class="emos">${renderEmos(cid, c)}</div>
      <div class="parts">${c.parts.map((p, i) => renderPart(cid, p, i)).join("")}</div>
    </section>`;
}

function renderMain() {
  const v = voices().find(x => x.id === voice);
  const list = visible();
  $("#main").innerHTML = `
    <h2 class="voice-title">${esc(v?.title || "")}</h2>
    <p class="voice-sub">${esc(voice)} · D — диалоги 10–15 с, U — ответы юнита 15–25 с, S00 — текущий образец (в b01: S — 10–15 с, L — 20–30 с)</p>
    ${list.length ? list.map(([cid, c]) => renderCard(cid, c)).join("") : `<div class="empty">Здесь всё сделано 👌</div>`}
    <div class="keys"><kbd>Пробел</kbd> играть/пауза · <kbd>1</kbd>–<kbd>5</kbd> оценка · <kbd>↓</kbd>/<kbd>↑</kbd> или <kbd>J</kbd>/<kbd>K</kbd> следующий/предыдущий ·
      в тексте <kbd>Enter</kbd> сохранить, <kbd>Esc</kbd> отменить</div>`;
  requestAnimationFrame(autosizeAll);  // после раскладки, иначе ширина поля ещё не известна
}

function autosizeAll() { document.querySelectorAll("textarea").forEach(autosize); }
window.addEventListener("resize", autosizeAll);

function render() { renderNav(); renderMain(); }
function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

function setActive(cid, scroll = true) {
  if (!cid) return;
  active = cid;
  document.querySelectorAll(".card.active").forEach(e => e.classList.remove("active"));
  const el = document.getElementById(cid);
  if (el) { el.classList.add("active"); if (scroll) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}

function move(step, play) {
  const ids = visible().map(([cid]) => cid);
  if (!ids.length) return;
  const i = ids.indexOf(active);
  const next = ids[Math.max(0, Math.min(ids.length - 1, i < 0 ? 0 : i + step))];
  setActive(next);
  if (play) { const a = $("audio", document.getElementById(next)); stopAll(a); a?.play(); }
}

function stopAll(except) {
  document.querySelectorAll("audio").forEach(a => { if (a !== except) a.pause(); });
  document.querySelectorAll(".play.playing").forEach(b => { b.classList.remove("playing"); b.textContent = "▶"; });
  playingRel = null;
}

async function saveRating(cid, patch) {
  const r = { ...rating(cid), ...patch };
  state.ratings[cid] = r;
  try {
    const res = await api("/api/rate", { id: cid, score: r.score, comment: r.comment });
    state.ratings[cid] = res.rating;
    toast("Оценка сохранена");
  } catch (e) { toast("Не сохранилось: " + e.message, true); }
  renderNav();
}

async function saveText(cid, i, text) {
  const part = state.clips[cid].parts[i];
  try {
    const res = await api("/api/text", { rel: part.rel, text });
    Object.assign(state.clips, res.clips);
    const n = Object.keys(res.clips).length;
    toast(n > 1 ? `Текст исправлен в ${n} клипах` : "Текст сохранён");
    for (const id of Object.keys(res.clips)) refreshCard(id);
    renderNav();
  } catch (e) { toast("Не сохранилось: " + e.message, true); }
}

async function saveTags(rels, change, note) {
  try {
    const res = await api("/api/tags", { rels, ...change });
    Object.assign(state.tags, res.tags);
    Object.assign(state.ratings, res.ratings);
    for (const cid of Object.keys(res.ratings)) refreshCard(cid);
    if (note) toast(note);
  } catch (e) { toast("Не сохранилось: " + e.message, true); }
}

// Перерисовывает карточку по частям, не трогая плеер клипа (звук не прерывается)
// и фразы с недосохранённой правкой текста.
function refreshCard(cid) {
  const card = document.getElementById(cid);
  if (!card) return;
  const c = state.clips[cid];
  $(".card-head", card).innerHTML = renderHead(cid, c);
  $(".emos", card).innerHTML = renderEmos(cid, c);
  card.querySelectorAll(".part").forEach(el => {
    if (el.classList.contains("dirty")) return;
    const i = +el.dataset.i;
    el.insertAdjacentHTML("afterend", renderPart(cid, c.parts[i], i));
    const fresh = el.nextElementSibling;
    el.remove();
    autosize($("textarea", fresh));
  });
}

function togglePicker(cid, i) {
  const prev = openPicker && openPicker.split("|")[0];
  openPicker = openPicker === `${cid}|${i}` ? null : `${cid}|${i}`;
  if (prev && prev !== cid) refreshCard(prev);
  refreshCard(cid);
}

// --- события ---
document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.filter) {
    filter = t.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b => b.classList.toggle("on", b === t));
    return renderMain();
  }
  if (t.id === "auto") { auto = !auto; localStore("auto", auto ? "1" : "0"); t.classList.toggle("on", auto); return; }
  const nav = t.closest("[data-voice]");
  if (nav) { voice = nav.dataset.voice; localStore("voice", voice); active = null; render(); window.scrollTo(0, 0); return; }

  const card = t.closest(".card");
  if (!card) return;
  const cid = card.dataset.cid;
  setActive(cid, false);
  if (t.dataset.score) {
    const score = String(rating(cid).score) === t.dataset.score ? "" : t.dataset.score;
    card.querySelectorAll("[data-score]").forEach(b => b.classList.toggle("on", b.dataset.score === score));
    return saveRating(cid, { score });
  }
  const clip = state.clips[cid];
  if (t.dataset.clipEmo) {
    // у всех фраз уже есть — снять со всех, иначе поставить всем (кроме «не брать»)
    const e = t.dataset.clipEmo, all = clipEmotion(clip, e) === "on";
    const rels = clip.parts.filter(p => all || !tagOf(p.rel).bad).map(p => p.rel);
    return saveTags(rels, all ? { remove: e } : { add: e });
  }
  const part = t.closest(".part");
  if (!part) return;
  const i = +part.dataset.i, p = clip.parts[i], ta = $("textarea", part);
  if (t.dataset.partEmo) {
    const e = t.dataset.partEmo;
    return saveTags([p.rel], emotionsOf(p.rel).includes(e) ? { remove: e } : { add: e });
  }
  if (t.dataset.untag) return saveTags([p.rel], { remove: t.dataset.untag });
  if (t.classList.contains("pick")) return togglePicker(cid, i);
  if (t.classList.contains("reject")) {
    const bad = !tagOf(p.rel).bad;
    return saveTags([p.rel], { bad }, bad ? "Фраза не попадёт в нарезки" : "Фраза снова в деле");
  }
  if (t.classList.contains("play")) {
    const pl = $("#part-player");
    if (t.classList.contains("playing")) { pl.pause(); return stopAll(); }
    stopAll();
    pl.src = "/src/" + p.rel.split("/").map(encodeURIComponent).join("/");
    pl.play(); t.classList.add("playing"); t.textContent = "■"; playingRel = p.rel;
    pl.onended = () => stopAll();
  }
  if (t.classList.contains("save")) saveText(cid, i, ta.value);
  if (t.classList.contains("confirm")) saveText(cid, i, p.text);
  if (t.classList.contains("take")) saveText(cid, i, p.alt.replace(/^[^:]+:\s*/, ""));
  if (t.classList.contains("cancel")) { ta.value = p.text; part.classList.remove("dirty"); autosize(ta); }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.tagName === "TEXTAREA") {
    const part = t.closest(".part"), p = state.clips[part.dataset.cid].parts[+part.dataset.i];
    part.classList.toggle("dirty", t.value !== p.text); autosize(t);
  }
});

document.addEventListener("change", e => {
  const t = e.target, card = t.closest(".card");
  if (!card) return;
  if (t.classList.contains("comment")) saveRating(card.dataset.cid, { comment: t.value });
});

document.addEventListener("play", e => {
  if (e.target.id === "part-player") return;
  stopAll(e.target);
  const card = e.target.closest(".card"); if (card) setActive(card.dataset.cid, false);
}, true);

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t.tagName === "TEXTAREA") {
    const part = t.closest(".part");
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (part.classList.contains("dirty")) $(".save", part).click(); t.blur(); }
    if (e.key === "Escape") { $(".cancel", part).click(); t.blur(); }
    return;
  }
  if (t.classList.contains("custom-emo") && e.key === "Enter" && t.value.trim()) {
    const card = t.closest(".card"), clip = state.clips[card.dataset.cid], value = t.value.trim().toLowerCase();
    const rels = t.dataset.scope === "clip"
      ? clip.parts.filter(p => !tagOf(p.rel).bad).map(p => p.rel)
      : [clip.parts[+t.closest(".part").dataset.i].rel];
    saveTags(rels, { add: value });
    return;
  }
  if (t.tagName === "INPUT") { if (e.key === "Enter" || e.key === "Escape") t.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === " ") {
    e.preventDefault();
    if (!active) move(0);
    const a = $("audio", document.getElementById(active));
    if (a) { if (a.paused) { stopAll(a); a.play(); } else a.pause(); }
  } else if (/^[1-5]$/.test(e.key) && active) {
    const card = document.getElementById(active);
    card.querySelectorAll("[data-score]").forEach(b => b.classList.toggle("on", b.dataset.score === e.key));
    saveRating(active, { score: e.key });
    if (auto) setTimeout(() => move(1, true), 250);
  } else if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); move(-1); }
});

(async () => {
  state = await api("/api/state");
  $("#batch").textContent = state.batch;
  document.title = "Отслушивание · " + state.batch;
  $("#auto").classList.toggle("on", auto);
  const vs = voices();
  const saved = localStore("voice");
  voice = vs.some(v => v.id === saved) ? saved : vs[0]?.id;
  render();
})();
</script>
</body>
</html>
