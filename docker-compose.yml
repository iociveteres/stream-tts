# StreamTTS из готового образа: этот файл можно скачать один, без репозитория (README, «Установка» → «Docker»), и
# запустить в пустой папке: docker compose up -d. Папки данных ниже Docker создаст рядом с ним. Обновление —
# docker compose pull && docker compose up -d. Видеокарта NVIDIA — ещё docker-compose.gpu.yml; сборка образа из
# исходников и папки проекта (эффекты, voice-refs) — docker-compose.dev.yml (его подключает ./setup.sh --build).
# Сюда — только папки данных: смонтированная папка проекта, которой нет рядом, создалась бы пустой и закрыла бы
# собой файлы образа (эффекты лежат в образе в /project/effects; tests/e2e/test_docker.py).
services:
  # Озвучка наград Twitch (docs/stream-tts.md) со встроенным cosyvoice-server: модель, устройство
  # и наборы голосов выбираются в админке, сервер запускается и останавливается вместе с stream-tts.
  stream-tts:
    image: ghcr.io/iociveteres/stream-tts:latest   # один образ с видеокартой и без: CUDA качается по кнопке в ./cuda
    init: true
    ports:
      # Админка и оверлей открыты в сеть: без пароля stream-tts пускает только адреса локальной сети, пароль для
      # доступа из интернета задаётся в админке. STREAM_TTS_BIND=127.0.0.1 — только с этого компьютера
      - "${STREAM_TTS_BIND:-0.0.0.0}:${STREAM_TTS_PORT:-8090}:8090"
      # WebUI и API cosyvoice-server для инструментов (scripts/, tools/). Только localhost; для доступа из сети
      # уберите "127.0.0.1:" и задайте серверу --api-key
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./stream-tts-data:/data                       # настройки, токены, SQLite, примеры голосов
      - ./models:/models                              # модели и пакеты; админка качает их сюда
      - ./espeech-runtime:/espeech-runtime            # Python с torch для ESpeech (~1,3 ГБ), качает админка
      - ./cuda:/cuda                                  # CUDA для видеокарт NVIDIA (~730 МБ), качает админка
      - ./voices:/voices                              # голоса .gguf и наборы в подпапках
    environment:
      STREAM_TTS_BIND: "${STREAM_TTS_BIND:-0.0.0.0}"
      STREAM_TTS_PORT: "${STREAM_TTS_PORT:-8090}"
      STREAM_TTS_PASSWORD: "${STREAM_TTS_PASSWORD:-}"   # необязателен: пароль задаётся в админке, переменная главнее
      STREAM_TTS_LANG: "${STREAM_TTS_LANG:-}"      # ru | en: язык при первом запуске, потом — в админке
      # MODEL сюда не передаётся: он закрепил бы модель и отключил выбор в админке.
      COSYVOICE_BACKEND: "${COSYVOICE_BACKEND:-}"  # auto | cuda | cpu, иначе выбор в админке
      TWITCH_CLIENT_ID: "${TWITCH_CLIENT_ID:-}"
    restart: unless-stopped
