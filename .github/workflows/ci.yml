# Конвейер для main: тесты (tests.yml), после них — образы (docker.yml) и установщик (windows.yml). На dev CI не
# запускается: там тесты гоняются локально по надобности (docs/development.md, «Тесты»), а любой из трёх файлов можно
# запустить и вручную на любой ветке (Actions → … → Run workflow).
# Выпуск — push в main и тег v<версия>: прогон по main проверяет образ и собирает установщик-артефакт, прогон по
# тегу — образ в GHCR (docker-compose.yml пользователя берёт его оттуда), установщик и релиз на GitHub. PR в main —
# только тесты.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый push в main отменяет прошлый прогон; теги уникальны, их прогоны друг друга не отменяют
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  docker:
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write   # docker push в ghcr.io по тегу
    uses: ./.github/workflows/docker.yml

  windows:
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: write   # gh release create по тегу
    uses: ./.github/workflows/windows.yml
