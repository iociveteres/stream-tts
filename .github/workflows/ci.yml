# Конвейер для main: тесты (tests.yml), после них — образы (docker.yml) и установщик (windows.yml). На dev CI не
# запускается: там тесты гоняются локально по надобности (docs/development.md, «Тесты»), а любой из трёх файлов можно
# запустить и вручную на любой ветке (Actions → … → Run workflow).
# Выпуск — push в main и тег v<версия>: прогон по main собирает образы и установщик-артефакт, прогон по тегу —
# установщик и релиз на GitHub (образы по тегу не собираются: тот же коммит уже собран по main). PR в main — только тесты.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый push в main отменяет прошлый прогон; теги уникальны, их прогоны друг друга не отменяют
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  docker:
    needs: tests
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/docker.yml

  windows:
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: write   # gh release create по тегу
    uses: ./.github/workflows/windows.yml
