# Запуск на видеокарте NVIDIA поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
# (или ./setup.sh --gpu, который прописывает оба файла в .env)
services:
  cosyvoice:
    build:
      args:
        GPU: cuda
    image: cosyvoice-server:cuda
    # --llm-flash-attn 0: на CUDA flash attention в LLM даёт лишние звуки в начале фразы
    # (а вместе с CUDA Graphs — мусор вместо речи); flow flash attention работает нормально.
    command: ["--host", "0.0.0.0", "--port", "8080", "--webui", "--cuda", "--llm-flash-attn", "0"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # stream-tts видит видеокарту только ради nvidia-smi (загрузка, память, температура на странице статистики)
  stream-tts:
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]
